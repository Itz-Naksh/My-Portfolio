<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 717 411" width="717" height="411" role="img" aria-label="Portfolio membership badge: MAAT, Member of AAT Sri Lanka, Fathima Naksha Banu">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4B3B8F"/>
      <stop offset="0.55" stop-color="#6A4AAD"/>
      <stop offset="1" stop-color="#9A6BB8"/>
    </linearGradient>
    <radialGradient id="glow" cx="85%" cy="15%" r="60%">
      <stop offset="0" stop-color="#E8A0BF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#E8A0BF" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurId" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- Card -->
  <rect x="2" y="2" width="713" height="407" rx="28" fill="url(#bg)"/>
  <rect x="2" y="2" width="713" height="407" rx="28" fill="url(#glow)"/>
  <!-- Subtle decorative rings -->
  <circle cx="640" cy="330" r="150" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2"/>
  <circle cx="640" cy="330" r="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2"/>

  <!-- Badge mark: ledger / balance icon -->
  <g transform="translate(36 42)" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="58" height="58" rx="14" fill="#FFFFFF" fill-opacity="0.12" stroke-opacity="0.9"/>
    <path d="M29 14 V44 M17 44 H41 M14 22 H44 M14 22 L8 34 H20 Z M44 22 L38 34 H50 Z"/>
  </g>
  <text x="110" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#FFFFFF" letter-spacing="1">MAAT</text>
  <text x="112" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" fill-opacity="0.85" letter-spacing="1.5">MEMBER · AAT SRI LANKA</text>

  <text x="680" y="70" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" fill-opacity="0.8" letter-spacing="1.5">PROFESSIONAL MEMBERSHIP</text>

  <!-- Membership ID (blurred) -->
  <text x="36" y="318" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" filter="url(#blurId)" letter-spacing="2">M17117</text>

  <!-- Name and title -->
  <text x="36" y="366" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">MS. FATHIMA NAKSHA BANU</text>
  <text x="680" y="366" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" fill-opacity="0.85">Accounting Technician</text>
</svg>
